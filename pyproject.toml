[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E: pycodestyle, F: Pyflakes, I: isort
select = ["E", "F", "I"]

ignore = [
    "E741", # Allow ambiguous variable names like 'l', 'I', or 'O'
    "E731", # Allow assigning lambda expressions to variables
]

[tool.ruff.lint.per-file-ignores]
# The tree-no-type scripts set os.environ["PARSER_VERSION"] before importing
# qnlp.constants (which reads it at import), so imports intentionally follow
# module-level code.
"*_tree_no_type.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
